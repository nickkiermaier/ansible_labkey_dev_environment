# playbooks/clone-labkey-repos.yml 
---
- name: Clone LabKey repos and configure Java/Gradle
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  vars_files:
  - ../group_vars/all.yml
  - ../group_vars/secrets.yml

  vars:
    base_repo_path: "{{ root_dir }}/{{ base_repo_name }}"
    server_path: "{{ base_repo_path }}/server"
    modules_path: "{{ server_path }}/modules"
    deps_path: "{{ root_dir }}/dependencies"
    java_archive_name: "OpenJDK{{ java_major_version }}U-jdk_x64_linux_hotspot_{{ java_version_filename }}.tar.gz"
    java_archive_path: "{{ deps_path }}/{{ java_archive_name }}"
    java_extract_path: "{{ deps_path }}/temurin{{ java_major_version }}-{{ java_version_full | replace('+','_') }}"

  # This ensures these variables are on the PATH for every task in this play
  environment:
    JAVA_HOME: "{{ java_extract_path }}"
    PATH: "{{ java_extract_path }}/bin:{{ base_repo_path }}/build/deploy/bin:{{ ansible_env.PATH }}"

  tasks:
  - name: Ensure root workspace exists
    file:
      path: "{{ root_dir }}"
      state: directory
      mode: "0755"

  - name: Clone base repo at git_version
    git:
      repo: "{{ base_repo_url }}"
      dest: "{{ base_repo_path }}"
      version: "{{ git_version }}"
      update: no
      accept_hostkey: true
    ignore_errors: yes

  - name: Ensure server and modules directories exist
    file:
      path: "{{ item }}"
      state: directory
      mode: "0755"
    loop:
    - "{{ server_path }}"
    - "{{ modules_path }}"

  - name: Clone server repos into server/
    git:
      repo: "{{ item }}"
      dest: "{{ server_path }}/{{ item | basename | regex_replace('\\.git$', '') }}"
      version: "{{ git_version }}"
      update: no
      accept_hostkey: true
    loop: "{{ server_repos }}"
    ignore_errors: yes

  - name: Clone module repos into server/modules/
    git:
      repo: "{{ item }}"
      dest: "{{ modules_path }}/{{ item | basename | regex_replace('\\.git$', '') }}"
      version: "{{ git_version }}"
      update: no
      accept_hostkey: true
      key_file: "{{ git_ssh_key }}"
    loop: "{{ module_repos }}"

  - name: Ensure <root_dir>/dependencies exists
    file:
      path: "{{ deps_path }}"
      state: directory
      mode: "0755"

  - name: Download pinned Temurin JDK tarball
    get_url:
      url: "{{ java_temurin_url | replace(' ', '') }}"
      dest: "{{ java_archive_path }}"
      mode: "0644"

  - name: Ensure JDK extraction directory exists
    file:
      path: "{{ java_extract_path }}"
      state: directory
      mode: "0755"

  - name: Extract JDK
    unarchive:
      src: "{{ java_archive_path }}"
      dest: "{{ java_extract_path }}"
      remote_src: true
      extra_opts:
      - --strip-components=1

  - name: Add JAVA_HOME and PATH entries to ~/.bashrc
    blockinfile:
      path: "{{ ansible_env.HOME }}/.bashrc"
      create: true
      marker: "# {mark} ANSIBLE MANAGED BLOCK: java-env"
      block: |
        # Java environment
        export JAVA_HOME="{{ java_extract_path }}"
        export PATH="$JAVA_HOME/bin:$PATH"
        export PATH="{{ base_repo_path }}/build/deploy/bin:$PATH"

  - name: Run gradlew ijWorkspaceSetup
    command: ./gradlew ijWorkspaceSetup
    args:
      chdir: "{{ base_repo_path }}"
    register: gradle_workspace
    ignore_errors: true

  - name: Run gradlew ijConfigure
    command: ./gradlew ijConfigure
    args:
      chdir: "{{ base_repo_path }}"
    register: gradle_configure
    ignore_errors: true

  - name: Update mssql.properties credentials
    lineinfile:
      path: "{{ base_repo_path }}/server/configs/mssql.properties"
      regexp: "{{ item.regex }}"
      line: "{{ item.line }}"
      mode: "0600"
    loop:
    - { regex: '^jdbcUser=', line: "jdbcUser={{ labkey_db_user }}" }
    - { regex: '^jdbcPassword=', line: "jdbcPassword={{ labkey_db_password }}" }

  - name: Run gradlew pickMSSQL
    command: ./gradlew pickMSSQL
    args:
      chdir: "{{ base_repo_path }}"
    register: pick_mssql
